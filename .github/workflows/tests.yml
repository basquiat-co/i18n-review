name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pas ubuntu-latest : passé à Ubuntu 26.04, où Playwright 1.56 refuse d'installer Chromium
    # (« does not support chromium on ubuntu26.04 »). À rouvrir avec la montée de Playwright.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Construit l'application puis la pilote dans Chromium avec une fausse API GitHub.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
